name: Fenrion Automated Video Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional custom topic (leave blank to pull next unused topic from topics.json)'
        required: false
        default: ''
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (1:00 PM WAT)

permissions:
  contents: write

jobs:
  produce-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Pillow

      - name: 1. Generate Script & Prompts (Google AI Studio - Gemini 2.5 Flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_story.py --topic "${{ github.event.inputs.topic }}"

      - name: 2. Synthesize TTS, Fetch Flux Visuals, Align Subtitles & Render Video
        run: |
          python build_video.py

      - name: 3. Deliver MP4 & Facebook Caption to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_telegram.py

      - name: 4. Upload MP4 as GitHub Workflow Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: fenrion-short-${{ github.run_id }}
          path: |
            output/fenrion_short.mp4
            build/story.json
          retention-days: 7

      - name: 5. Commit Updated topics.json State Back to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topics.json
          git diff --staged --quiet || git commit -m "chore(queue): mark topic as used [skip ci]"
          git push
